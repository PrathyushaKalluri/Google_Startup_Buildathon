name: kw_household
description: Keepwell zero-sign-in household surfaces (WhatsApp simulator, voice call dialer, video link, home memory, quote approval, payment, and OTP closure).
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  kw_ui:
    path: ../kw_ui
  kw_client:
    path: ../kw_client

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  http: ^1.2.2

flutter:
  uses-material-design: true
