# input/dataset/evaluator_only/voice_scripts.json (C05, C15).
# Used deterministically by services/agents/engines/urgency.py to guarantee
# 100% recall on safety cases across English, Hindi (Devanagari + Romanized),
# and Telugu (script + Romanized).

