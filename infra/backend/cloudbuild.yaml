# ============================================================================
# Keepwell Backend Cloud Build Configuration
# Builds and pushes backend image for kw-api and kw-worker to Artifact Registry
# Region: asia-south1 (Mumbai)
# ============================================================================

substitutions:
  _REGION: asia-south1
  _REPO: keepwell
  _IMAGE_NAME: backend
  _TAG: latest

steps:
  - name: gcr.io/cloud-builders/docker
    id: build-backend
    args:
      - build
      - -f
      - infra/backend/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE_NAME}:${_TAG}
      - .

  - name: gcr.io/cloud-builders/docker
    id: push-backend
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE_NAME}

  - name: gcr.io/cloud-builders/docker
    id: tag-kw-api
    args:
      - tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE_NAME}:${_TAG}
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/kw-api:${_TAG}

  - name: gcr.io/cloud-builders/docker
    id: tag-kw-worker
    args:
      - tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE_NAME}:${_TAG}
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/kw-worker:${_TAG}

  - name: gcr.io/cloud-builders/docker
    id: push-kw-api
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/kw-api:${_TAG}

  - name: gcr.io/cloud-builders/docker
    id: push-kw-worker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/kw-worker:${_TAG}

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE_NAME}:${_TAG}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/kw-api:${_TAG}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/kw-worker:${_TAG}

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
